name: Validate 9288 port

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out player repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Python build scripts
        run: |
          python3 -m py_compile \
            build_9288.py package_release_9288.py \
            tools/generate_aot_ebin.py \
            tests/emulator_qmp_smoke.py \
            tests/emulator_qmp_settings_smoke.py \
            tests/prepare_emulator_nand.py \
            tests/check_2x_frame.py

      - name: Check generated AOT blocks
        run: python3 tools/generate_aot_ebin.py --check

      - name: Build and run core smoke test
        run: |
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -Isrc \
            tests/s6502_arithmetic_test.c \
            -o /tmp/s6502-arithmetic-test
          /tmp/s6502-arithmetic-test
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -Isrc \
            -DS6502_NO_COMPUTED_GOTO \
            tests/s6502_arithmetic_test.c \
            -o /tmp/s6502-arithmetic-switch-test
          /tmp/s6502-arithmetic-switch-test
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Wno-unused-parameter -DDL_DOWN -D_RLS_ -Isrc \
            tests/core_smoke.c src/gam4980_core.c \
            -o /tmp/gam4980-core-smoke
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Wno-unused-parameter -DDL_DOWN -D_RLS_ \
            -DGAM4980_ENABLE_AOT -Isrc \
            tests/core_smoke.c src/gam4980_core.c \
            -o /tmp/gam4980-core-aot-smoke
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Wno-unused-parameter -DDL_DOWN -D_RLS_ \
            -DGAM4980_ENABLE_AOT -DGAM4980_ENABLE_GAME_LOAD_AOT \
            -DGAM4980_RUNTIME_PERFORMANCE_LOG -Isrc \
            tests/core_smoke.c src/gam4980_core.c \
            -o /tmp/gam4980-core-game-load-aot-smoke
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror \
            -Wno-unused-parameter -DDL_DOWN -D_RLS_ \
            -DGAM4980_ENABLE_PROFILING -Isrc \
            tools/gam4980_aot_profile.c src/gam4980_core.c \
            -o /tmp/gam4980-aot-profile
          /tmp/gam4980-core-smoke \
            应用/数据/游戏/gam4980/8.BIN \
            应用/数据/游戏/gam4980/E.BIN
          /tmp/gam4980-core-aot-smoke \
            应用/数据/游戏/gam4980/8.BIN \
            应用/数据/游戏/gam4980/E.BIN
          /tmp/gam4980-core-game-load-aot-smoke \
            应用/数据/游戏/gam4980/8.BIN \
            应用/数据/游戏/gam4980/E.BIN
